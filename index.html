<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal | Dashboard</title>
  <style>
    /* CSS Reset & Dark Theme Styling */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    .hidden { display: none !important; }
    
    /* Auth View Wrapper */
    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      padding: 20px;
    }
    .auth-card {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .brand-logo-badge {
      width: 44px; height: 44px; background: #2563eb; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.4rem; color: #fff;
    }
    .auth-logo h1 { font-size: 1.4rem; color: #fff; margin-top: 10px; }
    
    /* Form Elements */
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .auth-switch { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
    .auth-switch a { color: #60a5fa; text-decoration: none; cursor: pointer; }

    /* Global Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #121824;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-container { display: flex; align-items: center; gap: 12px; }
    .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .user-nav { display: flex; align-items: center; gap: 15px; }
    .avatar-circle {
      width: 38px; height: 38px; background: #3b82f6; color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem;
    }
    .logout-btn { color: #94a3b8; text-decoration: none; font-size: 0.9rem; cursor: pointer; background: none; border: none; }
    .logout-btn:hover { color: #fff; }

    /* Main Dashboard Layout */
    .app-container {
      max-width: 850px;
      margin: 40px auto;
      width: 100%;
      padding: 0 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
    }
    .card h2 { margin-bottom: 20px; font-size: 1.2rem; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    
    /* Bank Option Columns Grid */
    .bank-columns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .bank-column-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .bank-column-card:hover { border-color: #3b82f6; }
    .bank-column-card.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.05); }
    .bank-column-header { font-weight: bold; margin-bottom: 10px; color: #60a5fa; display: flex; justify-content: space-between; align-items: center; }
    
    .btn-success { background: #10b981; }
    .btn-success:hover { background: #059669; }
  </style>
</head>
<body>

  <!-- ================= AUTHENTICATION VIEW ================= -->
  <div id="authView" class="auth-wrapper">
    <!-- Sign Up Form -->
    <div id="signupCard" class="auth-card">
      <div class="auth-logo">
        <div class="brand-logo-badge">VB</div>
        <h1>Create Account</h1>
      </div>
      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="suFullName" placeholder="Enter your full name" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="suEmail" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="suPassword" placeholder="Create a password" required />
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
      <div class="auth-switch">
        Already have an account? <a onclick="switchAuthMode('login')">Login</a>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginCard" class="auth-card hidden">
      <div class="auth-logo">
        <div class="brand-logo-badge">VB</div>
        <h1>Welcome Back</h1>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="liEmail" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="liPassword" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <div class="auth-switch">
        Don't have an account? <a onclick="switchAuthMode('signup')">Sign Up</a>
      </div>
    </div>
  </div>

  <!-- ================= DASHBOARD / APP VIEW ================= -->
  <div id="appView" class="hidden">
    <!-- Global Header with Logo and Full Name -->
    <header class="app-header">
      <div class="brand-container">
        <div class="brand-logo-badge" style="width: 34px; height: 34px; font-size: 1.1rem;">VB</div>
        <span class="brand-name">VaultBank</span>
      </div>
      <div class="user-nav">
        <span style="font-size: 0.95rem;">Welcome, <strong id="headerFullName">User Name</strong></span>
        <div class="avatar-circle" id="headerInitials">UN</div>
        <button onclick="handleLogout()" class="logout-btn">Sign Out</button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="app-container">
      <!-- Balance Overview Card -->
      <div class="card">
        <h2>Account Balance</h2>
        <div style="font-size: 1.8rem; font-weight: bold; color: #10b981;">$18,450.00</div>
      </div>

      <!-- Withdrawal Card (Strictly 3 Bank Option Columns) -->
      <div class="card">
        <h2>Request Withdrawal</h2>
        <form id="withdrawalForm">
          <div class="form-group">
            <label>Withdrawal Amount ($)</label>
            <input type="number" id="withdrawAmount" placeholder="0.00" min="1" required />
          </div>

          <label style="display: block; margin-bottom: 10px; font-size: 0.85rem; color: #cbd5e1;">Select Bank Option Column (Choose 1 of 3 Available)</label>
          
          <div class="bank-columns-grid">
            <!-- Bank Option 1 -->
            <div class="bank-column-card" onclick="selectBankOption(1)" id="bankCard1">
              <div class="bank-column-header">
                <span>Bank Option 1</span>
                <input type="radio" name="bankOptionGroup" value="Option 1" required />
              </div>
              <div class="form-group" style="margin-bottom: 10px;">
                <label style="font-size: 0.75rem;">Bank Name</label>
                <input type="text" id="bankName1" placeholder="Enter Bank Name" />
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label style="font-size: 0.75rem;">Account Number</label>
                <input type="text" id="accountNum1" placeholder="Account Number" maxlength="10" />
              </div>
            </div>

            <!-- Bank Option 2 -->
            <div class="bank-column-card" onclick="selectBankOption(2)" id="bankCard2">
              <div class="bank-column-header">
                <span>Bank Option 2</span>
                <input type="radio" name="bankOptionGroup" value="Option 2" />
              </div>
              <div class="form-group" style="margin-bottom: 10px;">
                <label style="font-size: 0.75rem;">Bank Name</label>
                <input type="text" id="bankName2" placeholder="Enter Bank Name" />
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label style="font-size: 0.75rem;">Account Number</label>
                <input type="text" id="accountNum2" placeholder="Account Number" maxlength="10" />
              </div>
            </div>

            <!-- Bank Option 3 -->
            <div class="bank-column-card" onclick="selectBankOption(3)" id="bankCard3">
              <div class="bank-column-header">
                <span>Bank Option 3</span>
                <input type="radio" name="bankOptionGroup" value="Option 3" />
              </div>
              <div class="form-group" style="margin-bottom: 10px;">
                <label style="font-size: 0.75rem;">Bank Name</label>
                <input type="text" id="bankName3" placeholder="Enter Bank Name" />
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label style="font-size: 0.75rem;">Account Number</label>
                <input type="text" id="accountNum3" placeholder="Account Number" maxlength="10" />
              </div>
            </div>
          </div>

          <button type="submit" class="btn-primary btn-success">Submit Withdrawal Request</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Single-File Client Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const storedName = localStorage.getItem('userFullName');
      if (storedName) {
        renderApp(storedName);
      } else {
        renderAuth();
      }
    });

    function switchAuthMode(mode) {
      if (mode === 'login') {
        document.getElementById('signupCard').classList.add('hidden');
        document.getElementById('loginCard').classList.remove('hidden');
      } else {
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('signupCard').classList.remove('hidden');
      }
    }

    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const fullName = document.getElementById('suFullName').value.trim();
      if(fullName) {
        localStorage.setItem('userFullName', fullName);
        renderApp(fullName);
      }
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let fullName = localStorage.getItem('userFullName') || 'Alex Morgan';
      localStorage.setItem('userFullName', fullName);
      renderApp(fullName);
    });

    function renderApp(fullName) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');

      document.getElementById('headerFullName').textContent = fullName;
      const initials = fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('headerInitials').textContent = initials || 'UN';
    }

    function renderAuth() {
      document.getElementById('appView').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
    }

    function handleLogout() {
      localStorage.removeItem('userFullName');
      document.getElementById('signupForm').reset();
      document.getElementById('loginForm').reset();
      renderAuth();
    }

    function selectBankOption(optionNumber) {
      for(let i = 1; i <= 3; i++) {
        document.getElementById(`bankCard${i}`).classList.remove('selected');
      }
      const selectedCard = document.getElementById(`bankCard${optionNumber}`);
      selectedCard.classList.add('selected');
      const radio = selectedCard.querySelector('input[type="radio"]');
      radio.checked = true;
    }

    document.getElementById('withdrawalForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = document.getElementById('withdrawAmount').value;
      const selectedRadio = document.querySelector('input[name="bankOptionGroup"]:checked');
      
      if(!selectedRadio) {
        alert('Please select one of the 3 bank option columns.');
        return;
      }

      const optionNum = selectedRadio.value.replace('Option ', '');
      const bankName = document.getElementById(`bankName${optionNum}`).value || `Bank Option ${optionNum}`;
      const accountNum = document.getElementById(`accountNum${optionNum}`).value;

      alert(`Success! Withdrawal of $${amount} via ${selectedRadio.value} (${bankName} - Account: ${accountNum}) has been submitted.`);
      document.getElementById('withdrawalForm').reset();
      for(let i = 1; i <= 3; i++) {
        document.getElementById(`bankCard${i}`).classList.remove('selected');
      }
    });
  </script>

  <!-- ================= CHATWAY LIVE SUPPORT WIDGET ================= -->
  <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=EDicIiTepGoB"></script>
</body>
</html>
