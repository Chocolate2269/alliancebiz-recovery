<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Alliance Biz Capital — Tawk Only</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#070a14;color:#e2e8f0}
.aurora{position:fixed;inset:0;z-index:-2;background:radial-gradient(at 15% 10%,rgba(16,185,129,.35),transparent),radial-gradient(at 85% 15%,rgba(99,102,241,.4),transparent),#070a14}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1)}
.btn-grad{background:linear-gradient(135deg,#10b981,#6366f1)}
.page{display:none}.page.active{display:block}
input{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;color:white!important}
</style>
</head>
<body>
<div class="aurora"></div>

<nav class="glass sticky top-0 z-50 flex justify-between px-6 py-4">
<b class="text-white">Alliance Biz Capital</b>
<div class="flex gap-2">
<button onclick="go('home')" class="glass px-4 py-2 rounded-full text-sm">Home</button>
<button onclick="go('login')" class="glass px-4 py-2 rounded-full text-sm">Login</button>
<button onclick="go('signup')" class="btn-grad px-5 py-2 rounded-full text-sm text-white font-bold">Sign Up</button>
</div>
</nav>

<div id="page-home" class="page active max-w-6xl mx-auto px-6 py-20 text-center">
<h1 class="text-6xl font-extrabold text-white">Grow your crypto<br><span style="background:linear-gradient(135deg,#10b981,#6366f1);-webkit-background-clip:text;color:transparent">with confidence</span></h1>
<p class="text-slate-400 mt-4">Chatway removed — Only Tawk.to popping</p>
<button onclick="go('signup')" class="btn-grad px-10 py-4 rounded-full text-white font-bold mt-8">Get Started</button>
</div>

<div id="page-signup" class="page max-w-md mx-auto px-6 py-16">
<div class="glass rounded-[2rem] p-8">
<h2 class="text-xl font-bold text-white text-center">Create Account</h2>
<input class="w-full mt-6 p-4 rounded-xl" placeholder="Full Name"/>
<input class="w-full mt-3 p-4 rounded-xl" placeholder="Email"/>
<input type="password" class="w-full mt-3 p-4 rounded-xl" placeholder="Password"/>
<button onclick="go('dashboard')" class="btn-grad w-full mt-6 py-4 rounded-xl text-white font-bold">Sign Up → Dashboard</button>
<p class="text-center text-sm text-slate-400 mt-4">Have account? <span onclick="go('login')" class="text-emerald-400 font-bold cursor-pointer">Login</span></p>
</div>
</div>

<div id="page-login" class="page max-w-md mx-auto px-6 py-16">
<div class="glass rounded-[2rem] p-8">
<h2 class="text-xl font-bold text-white text-center">Login</h2>
<input class="w-full mt-6 p-4 rounded-xl" placeholder="Email"/>
<input type="password" class="w-full mt-3 p-4 rounded-xl" placeholder="Password"/>
<button onclick="go('dashboard')" class="btn-grad w-full mt-6 py-4 rounded-xl text-white font-bold">Login → Dashboard</button>
</div>
</div>

<div id="page-dashboard" class="page max-w-7xl mx-auto px-6 py-10">
<h2 class="text-2xl font-bold text-white">Full Design Dashboard</h2>
<div class="grid md:grid-cols-3 gap-4 mt-6">
<div class="glass p-6 rounded-[1.5rem]"><p class="text-xs text-slate-400">Balance</p><p class="text-3xl font-bold text-white">$12,480</p></div>
<div class="glass p-6 rounded-[1.5rem]"><p class="text-xs text-slate-400">Profit</p><p class="text-3xl font-bold text-emerald-400">+$1,376</p></div>
<div class="glass p-6 rounded-[1.5rem]"><button onclick="Tawk_API.maximize()" class="btn-grad w-full py-3 rounded-full text-white font-bold">💬 Open Support</button></div>
</div>
</div>

<script>
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active')}
</script>

<!--Start of Tawk.to Script — ONLY TAWK NOW -->

</body>
</html>
